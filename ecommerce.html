<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store | Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .shop-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #111; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .cart-icon { font-size: 1.5rem; color: var(--accent); position: relative; cursor: pointer; }
        .cart-count { position: absolute; top: -10px; right: -10px; background: #fff; color: #000; font-size: 0.8rem; padding: 2px 6px; border-radius: 50%; font-weight: bold; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; padding: 50px 10%; }
        .product-item { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: translateY(30px); animation: fadeInUp 0.6s forwards; }
        .product-item:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2); }
        
        .product-img { height: 250px; background-size: cover; background-position: center; transition: 0.5s; }
        .product-item:hover .product-img { filter: brightness(1.1); }
        
        .product-details { padding: 20px; text-align: center; }
        .price { color: var(--accent); font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .add-cart-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; width: 100%; }
        .add-cart-btn:hover { background: var(--accent); color: #000; }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .product-item:nth-child(1) { animation-delay: 0.1s; }
        .product-item:nth-child(2) { animation-delay: 0.2s; }
        .product-item:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <header class="shop-header">
        <h2>NEON STORE</h2>
        <div class="cart-icon">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-count" id="cart-qty">0</span>
        </div>
    </header>

    <section class="product-grid">
        <!-- Product 1 -->
        <div class="product-item">
            <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80')"></div>
            <div class="product-details">
                <h3>Cyber Runners</h3>
                <p class="price">$120.00</p>
                <button class="add-cart-btn" onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="product-item">
            <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80')"></div>
            <div class="product-details">
                <h3>Audio Blast</h3>
                <p class="price">$85.00</p>
                <button class="add-cart-btn" onclick="addToCart()">Add to Cart</button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="product-item">
            <div class="product-img" style="background-image: url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80')"></div>
            <div class="product-details">
                <h3>Neon Watch</h3>
                <p class="price">$250.00</p>
                <button class="add-cart-btn" onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </section>

    <div style="text-align: center; padding-bottom: 50px;">
        <a href="./index.html" class="btn">Back to Portfolio</a>
    </div>

    <script>
        let count = 0;
        function addToCart() {
            count++;
            const qtyLabel = document.getElementById('cart-qty');
            qtyLabel.innerText = count;
            
            // Animation effect for cart
            qtyLabel.style.transform = "scale(1.5)";
            setTimeout(() => {
                qtyLabel.style.transform = "scale(1)";
            }, 200);
        }
    </script>
</body>
</html>
